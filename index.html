<title>Cuaderno de campo</title>
<style>
:root{--bg:#EEF2E9;--card:#fff;--ink:#12241B;--muted:#4C6055;--line:#C9D5CB;--green:#1E5C41;--tint:#DDEADF;--gold:#F2B01E;--ph1:#CFDCCF;--ph2:#C3D3C6;--ctl:48px}
[data-hc="1"]{--bg:#fff;--ink:#000;--muted:#1d1d1d;--line:#000;--tint:#E3EEE6;--green:#0B3D27}
[data-big="1"]{--ctl:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#D5DDD2;overscroll-behavior:none}
html{touch-action:manipulation}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:var(--ink)}
button{font:inherit;color:inherit}
#app{max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:500px){#app{height:min(calc(100dvh - 32px),880px);margin:16px auto;border-radius:28px;box-shadow:0 8px 40px rgba(0,0,0,.18);border:1px solid var(--line)}}
h1{margin:2px 0 0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.head{display:flex;justify-content:space-between;align-items:flex-end;padding:calc(28px + env(safe-area-inset-top)) 20px 8px;flex-shrink:0}
.eyebrow{font-size:14px;color:var(--muted);font-weight:500}
.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.pillwrap{padding:8px 20px 4px;flex-shrink:0}
.pill{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:20px;background:var(--tint);color:var(--green);font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#C98A00;display:inline-block}
.scroll{flex:1;overflow:auto;padding:12px 20px;-webkit-overflow-scrolling:touch}
.list{display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.proj{display:flex;align-items:center;gap:14px;padding:16px;text-align:left;width:100%;cursor:pointer;flex-shrink:0}
.ico{width:52px;height:52px;border-radius:14px;background:var(--tint);color:var(--green);display:grid;place-items:center;flex-shrink:0}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.t{font-size:17px;font-weight:700}
.sub{font-size:14px;color:var(--muted);margin-top:2px}
.stats{display:flex;gap:14px;margin-top:8px;font-size:13px;font-weight:600;color:var(--green)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;line-height:1.5}
.cta{padding:8px 20px 16px;flex-shrink:0}
.btn{min-height:var(--ctl);border:0;border-radius:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;cursor:pointer;font-size:16px}
.btn.big{width:100%;height:64px;border-radius:20px;font-size:18px}
.btn.full{width:100%}
.gold{background:var(--gold);color:#12241B}
.green{background:var(--green);color:#fff}
.ghost{background:transparent;border:2px solid var(--green);color:var(--green)}
.danger{background:transparent;border:2px solid #9B2C2C;color:#9B2C2C}
.tabbar{display:flex;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);flex-shrink:0}
.tab{flex:1;border:0;background:transparent;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tab span{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab.on{color:var(--green)}.tab.on span{background:var(--tint)}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:calc(14px + env(safe-area-inset-top)) 12px 6px;flex-shrink:0}
.top .l{display:flex;align-items:center;gap:6px;min-width:0}
.top h2{margin:0;font-size:20px;line-height:1.15;font-weight:800}
.top small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.ib{width:48px;height:48px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;border-radius:50%;cursor:pointer;flex-shrink:0}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:var(--ctl)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
textarea{resize:none;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.gps{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--tint);color:var(--green);font-size:14px;font-weight:600}
.gps button{margin-left:auto;min-height:36px;border:0;background:transparent;color:var(--green);font-weight:700;text-decoration:underline;cursor:pointer}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.add{width:76px;height:76px;border:2px dashed var(--green);border-radius:16px;background:var(--card);color:var(--green);display:grid;place-items:center;cursor:pointer}
.thumb{width:76px;height:76px;border-radius:16px;background:center/cover var(--ph1);position:relative}
.thumb .x{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:#12241B;color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:0}
.tag{position:absolute;left:4px;bottom:4px;padding:2px 6px;border-radius:8px;background:var(--green);color:#fff;font-size:11px;font-weight:600}
.ph{background:repeating-linear-gradient(135deg,var(--ph1) 0 6px,var(--ph2) 6px 12px)}
.qty{display:flex;align-items:center;justify-content:space-between}
.qty b{font-size:15px}
.qty .c{display:flex;align-items:center;gap:14px}
.qty .n{min-width:44px;text-align:center;font-size:32px;font-weight:800}
.qb{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.qb.p{background:var(--green);color:#fff;border-color:var(--green)}
.foot{padding:12px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);flex-shrink:0}
.notes{display:flex;gap:10px;align-items:flex-start}
.mic{width:48px;height:48px;flex-shrink:0;border-radius:50%;border:0;background:var(--tint);color:var(--green);display:grid;place-items:center;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.cell small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.cell b{display:block;font-size:15px;margin-top:2px}
.span2{grid-column:span 2}
.hero{height:190px;border-radius:20px;display:grid;place-items:center;color:var(--muted);font-weight:600}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px}
.car img{flex:0 0 100%;height:210px;object-fit:cover;border-radius:20px;scroll-snap-align:center}
.sp{font-size:26px;font-weight:800;font-style:italic;line-height:1.1}
.badge{padding:8px 14px;border-radius:18px;background:var(--tint);color:var(--green);font-size:14px;font-weight:700;white-space:nowrap}
.map{border-radius:18px;overflow:hidden;background:#DCE6D6;border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.sheetcard{display:flex;gap:14px;align-items:center;padding:14px;margin-top:12px}
.sheetcard .th{width:64px;height:64px;border-radius:14px;flex-shrink:0;background-size:cover;background-position:center}
.i{font-style:italic}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.tile.g{background:var(--green);color:#fff;border-color:var(--green)}
.tile b{display:block;font-size:30px;line-height:1;font-weight:800}
.tile span{font-size:13px;display:block;margin-top:4px}
.h3{font-size:17px;font-weight:800;margin:0}
.obsrow{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:68px;width:100%;border:0;border-bottom:1px solid #E1E8E2;background:none;text-align:left;cursor:pointer}
.obsrow:last-child{border-bottom:0}
.obsrow .th{width:48px;height:48px;border-radius:12px;flex-shrink:0;background-size:cover;background-position:center}
.grp{border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 14px;min-height:56px;width:100%;background:none;border:0;border-bottom:1px solid #E1E8E2;text-align:left}
.r:last-child{border-bottom:0}
.r .v{font-size:14px;color:var(--muted)}
.r small{display:block;font-size:13px;color:var(--muted)}
.r select{width:auto;min-height:44px;padding:6px 10px}
.sw{width:56px;height:44px;border:0;background:transparent;display:grid;align-items:center;justify-items:end;cursor:pointer;flex-shrink:0}
.sw i{display:block;position:relative;width:52px;height:30px;border-radius:15px;background:#8FA396}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw[aria-checked=true] i{background:var(--green)}
.sw[aria-checked=true] i::after{left:25px}
.gl{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px 4px}
.modal{position:absolute;inset:0;background:rgba(18,36,27,.5);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:20px;display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#12241B;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#print{display:none}
@media print{#app,#toast{display:none!important}#print{display:block;font-family:system-ui,sans-serif;color:#000}#print table{border-collapse:collapse;width:100%;font-size:11px}#print th,#print td{border:1px solid #888;padding:4px 6px;text-align:left}body{background:#fff}}
#splash{position:fixed;inset:0;z-index:20;background:#1E5C41;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:140px;height:140px;animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
#splash b{font-size:27px;font-weight:800;letter-spacing:-.01em;animation:rise .6s .25s both}
#splash span{font-size:15px;opacity:.85;animation:rise .6s .4s both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){#splash svg,#splash b,#splash span{animation:none}}
.brand{display:flex;align-items:center;gap:8px}
.welcome{display:flex;flex-direction:column;gap:18px;padding-top:calc(36px + env(safe-area-inset-top))}
.welcome .mark{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.welcome p{margin:0;color:var(--muted);line-height:1.45}
.feat{display:flex;gap:14px;align-items:flex-start}
.feat .ico{width:46px;height:46px;border-radius:14px}
.feat b{display:block;font-size:16px}
.feat span{font-size:14px;color:var(--muted);line-height:1.4}
</style>
</head>

<script>

var I={

var $=function(s){return document.querySelector(s)};
var app=$('#app');

/* ---------- datos ---------- */
function seed(){

function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.projects&&s.obs&&s.settings)return s}catch(e){}return seed()}

function pad(n){return String(n).padStart(2,'0')}
function hm(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}
function when(ts){
 var d=new Date(ts),n=new Date(),y=new Date(n.getTime()-864e5);
 if(d.toDateString()===n.toDateString())return 'hoy '+hm(ts);
 if(d.toDateString()===y.toDateString())return 'ayer '+hm(ts);
 return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'})+' '+hm(ts)
}
function full(ts){var d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+', '+hm(ts)}
function dms(v,pos,neg){var h=v>=0?pos:neg;v=Math.abs(v);var d=Math.floor(v),m=Math.floor((v-d)*60),s=((v-d)*60-m)*60;return d+'° '+m+"' "+s.toFixed(1)+'" '+h}
function coord(lat,lon){
 if(lat==null||lon==null)return 'Sin coordenadas';
 return S.settings.coord==='dms'?dms(lat,'N','S')+', '+dms(lon,'E','O'):lat.toFixed(5)+', '+lon.toFixed(5)
}
function th(o){return o.photos&&o.photos.length?'background-image:url("'+o.photos[0]+'")':''}
function stats(list){return{n:list.length,sp:new Set(list.map(function(x){return x.sci.toLowerCase()})).size,ind:list.reduce(function(a,x){return a+x.qty},0)}}

function mapv(){
 var f=view.pid||'all',list=S.obs.filter(function(o){return o.lat!=null&&(f==='all'||o.pid===f)});
 var chips='<button class="chip'+(f==='all'?' on':'')+'" data-act="mapfilter" data-id="all">Todos</button>'+S.projects.map(function(p){return '<button class="chip'+(f===p.id?' on':'')+'" data-act="mapfilter" data-id="'+p.id+'">'+esc(p.name)+'</button>'}).join('');
 var body;
 if(!list.length){body='<p class="empty">Aún no hay observaciones con ubicación.<br>Activa el GPS al registrar para verlas aquí.</p>'}
 else{
  var W=360,H=380,lats=list.map(function(o){return o.lat}),lons=list.map(function(o){return o.lon});
  var a=Math.min.apply(null,lats),b=Math.max.apply(null,lats),c=Math.min.apply(null,lons),d=Math.max.apply(null,lons);
  var sl=Math.max(b-a,0.002),sn=Math.max(d-c,0.002);
  var k=Math.min((W-80)/sn,(H-80)/sl);var cx=(c+d)/2,cy=(a+b)/2;
  function X(lon){return W/2+(lon-cx)*k}
  function Y(lat){return H/2-(lat-cy)*k}
  var grid='';for(var i=1;i<6;i++){grid+='<path d="M'+(i*60)+' 0V'+H+'" stroke="#C3D3BD" stroke-width="1"/>'}
  for(var j=1;j<7;j++){grid+='<path d="M0 '+(j*54)+'H'+W+'" stroke="#C3D3BD" stroke-width="1"/>'}
  var pins=list.map(function(o){
   var on=view.sel===o.id,x=X(o.lon).toFixed(1),y=Y(o.lat).toFixed(1);
   return '<g class="pin" data-act="pin" data-id="'+o.id+'" role="button" tabindex="0" aria-label="'+esc(o.sci)+'"><circle cx="'+x+'" cy="'+y+'" r="'+(on?20:16)+'" fill="'+(on?'#F2B01E':'#1E5C41')+'" stroke="#fff" stroke-width="3"/><text x="'+x+'" y="'+(+y+5)+'" text-anchor="middle" font-size="14" font-weight="800" fill="'+(on?'#12241B':'#fff')+'">'+o.qty+'</text></g>'
  }).join('');
  body='<div class="map"><svg viewBox="0 0 '+W+' '+H+'" role="group" aria-label="Mapa de observaciones"><rect width="'+W+'" height="'+H+'" fill="#DCE6D6"/>'+grid+'<text x="338" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#4C6055">N ↑</text><text x="12" y="'+(H-10)+'" font-size="11" fill="#4C6055">Vista esquemática (sin mapa base)</text>'+pins+'</svg></div>';
  var s=list.find(function(o){return o.id===view.sel});
  body+=s?'<div class="card sheetcard"><span class="th ph" style="'+th(s)+'"></span><span class="grow"><b class="i" style="font-size:18px">'+esc(s.sci)+'</b><span class="sub">'+s.qty+' ind. · '+when(s.ts)+'</span><span class="sub" style="font-size:13px;margin:0">'+esc((proj(s.pid)||{}).name||'')+'</span></span><button class="btn green" data-act="open" data-id="'+s.id+'">Ver detalle</button></div>':'<p class="empty" style="padding:16px 10px 0">Toca un punto del mapa para ver la observación.</p>'
 }
 return '<header class="head"><div><div class="eyebrow">'+list.length+' observaciones con ubicación</div><h1>Mapa</h1></div></header><div class="scroll stack"><div class="chips">'+chips+'</div>'+body+'</div>'+tabbar('map')
}

function newDraft(pid){

function requestGps(){
 if(!draft)return;
 draft.gpsState='wait';updGps();
 if(!navigator.geolocation){draft.gpsState='err';updGps();return}
 navigator.geolocation.getCurrentPosition(function(p){
  if(!draft)return;
  draft.lat=p.coords.latitude;draft.lon=p.coords.longitude;draft.alt=p.coords.altitude;draft.acc=p.coords.accuracy||0;draft.gpsState='ok';updGps()
 },function(){if(!draft)return;draft.gpsState=draft.lat!=null?'ok':'err';updGps();toast('No se pudo obtener la ubicación')},{enableHighAccuracy:!S.settings.gps,timeout:15000,maximumAge:S.settings.gps?60000:0})
}
function updGps(){var g=$('#gps');if(g&&draft)g.innerHTML=gpsHtml()}
function readImg(file){
 return new Promise(function(res){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){var m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.onerror=function(){res(null)};im.src=r.result};
  r.onerror=function(){res(null)};r.readAsDataURL(file)
 })
}
function dictate(){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast('El dictado no está disponible en este navegador');return}
 var r=new SR();r.lang='es-CO';
 r.onresult=function(e){var t=e.results[0][0].transcript;draft.notes=(draft.notes?draft.notes+' ':'')+t;var ta=$('#notes');if(ta)ta.value=draft.notes};
 r.onerror=function(){toast('No se pudo usar el micrófono')};
 try{r.start();toast('Escuchando…')}catch(e){toast('No se pudo usar el micrófono')}
}
function saveObs(){
 var d=draft,sci=d.sci.trim();
 if(!sci){toast('Escribe o elige una especie');var f=$('#f-sci');if(f)f.focus();return}
 if(!d.pid){toast('Crea un proyecto primero');return}
 var o={id:d.editId||uid(),pid:d.pid,sci:sci,common:d.common.trim(),qty:d.qty,habitat:d.habitat,weather:d.weather,temp:d.temp===''||d.temp==null?null:Number(d.temp),notes:d.notes.trim(),lat:d.lat,lon:d.lon,alt:d.alt,acc:d.acc,ts:d.ts,photos:d.photos};
 var i=S.obs.findIndex(function(x){return x.id===o.id});
 if(i>-1)S.obs[i]=o;else S.obs.push(o);
 if(!save()){if(i===-1)S.obs.pop();return}
 var editing=!!d.editId;draft=null;toast('Observación guardada');
 if(editing)back();else replace({name:'detail',id:o.id})
}

/* ---------- exportar ---------- */
function dl(name,mime,content){
 var b=new Blob([content],{type:mime}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)
}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'datos'}
function csv(list){
 var head=['proyecto','fecha','hora','nombre_cientifico','nombre_comun','cantidad','habitat','clima','temperatura_c','latitud','longitud','altitud_m','precision_m','notas'];
 function q(v){v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
 var rows=list.map(function(o){var d=new Date(o.ts),p=proj(o.pid);return [p?p.name:'',d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),hm(o.ts),o.sci,o.common,o.qty,o.habitat,o.weather,o.temp,o.lat,o.lon,o.alt!=null?Math.round(o.alt):'',o.acc!=null?Math.round(o.acc):'',o.notes].map(q).join(',')});
 return '﻿'+head.join(',')+'\n'+rows.join('\n')
}
function kml(name,list){
 var pm=list.filter(function(o){return o.lat!=null}).map(function(o){return '<Placemark><name>'+esc(o.sci)+'</name><description>'+esc((o.common?o.common+' · ':'')+o.qty+' ind. · '+full(o.ts)+(o.notes?' · '+o.notes:''))+'</description><Point><coordinates>'+o.lon+','+o.lat+','+(o.alt||0)+'</coordinates></Point></Placemark>'}).join('');
 return '<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>'+esc(name)+'</name>'+pm+'</Document></kml>'
}
function printList(p,list){
 var rows=list.map(function(o){return '<tr><td>'+full(o.ts)+'</td><td><i>'+esc(o.sci)+'</i></td><td>'+esc(o.common)+'</td><td>'+o.qty+'</td><td>'+esc(o.habitat)+'</td><td>'+esc(o.weather+(o.temp!=null?' '+o.temp+' °C':''))+'</td><td>'+esc(coord(o.lat,o.lon))+'</td><td>'+esc(o.notes)+'</td></tr>'}).join('');
 $('#print').innerHTML='<h1>'+esc(p.name)+'</h1><p>'+esc(p.place)+' · '+list.length+' registros · exportado '+full(Date.now())+'</p><table><thead><tr><th>Fecha</th><th>Especie</th><th>Nombre común</th><th>Cant.</th><th>Hábitat</th><th>Clima</th><th>Coordenadas</th><th>Notas</th></tr></thead><tbody>'+rows+'</tbody></table>';
 window.print()
}
function exportProject(id){
 var p=proj(id);if(!p)return;
 var list=S.obs.filter(function(o){return o.pid===id}).sort(function(a,b){return a.ts-b.ts});
 if(!list.length){toast('Este proyecto no tiene registros');return}
 if(expFmt==='csv'){dl(slug(p.name)+'.csv','text/csv;charset=utf-8',csv(list));toast('Archivo CSV descargado')}
 else if(expFmt==='kml'){
  if(!list.some(function(o){return o.lat!=null})){toast('Ningún registro tiene coordenadas');return}
  dl(slug(p.name)+'.kml','application/vnd.google-earth.kml+xml',kml(p.name,list));toast('Archivo KML descargado')
 }else printList(p,list)
}

/* ---------- modal ---------- */
function modal(html){var m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet">'+html+'</div>';m.addEventListener('click',function(e){if(e.target===m)m.remove()});app.appendChild(m);return m}

/* ---------- acciones ---------- */
function act(a,el){
 var ds=el.dataset;
 switch(a){
  case 'startdemo':S.settings.welcomed=true;save();view={name:'home'};render();break;
  case 'startempty':S={projects:[],obs:[],settings:S.settings};S.settings.welcomed=true;save();view={name:'home'};render();break;
  case 'install':if(deferred){deferred.prompt();deferred.userChoice.then(function(){deferred=null;if(view.name==='settings')render()})}break;
  case 'tab':tab(ds.to);break;
  case 'back':draft=null;back();break;
  case 'project':go({name:'project',id:ds.id});break;
  case 'open':{var m=$('.modal');if(m)m.remove();go({name:'detail',id:ds.id});break}
  case 'new':{
   if(!S.projects.length){act('newproject',el);toast('Primero crea un proyecto');break}
   var pid=ds.pid||(view.name==='project'?view.id:(S.obs.length?S.obs[S.obs.length-1].pid:S.projects[0].id));
   draft=newDraft(pid);go({name:'new'});requestGps();break
  }
  case 'newproject':{
   var mo=modal('<h3 class="h3">Nuevo proyecto</h3><div><label class="lbl" for="np-name">Nombre</label><input id="np-name" placeholder="Ej: Salida 4 · Transecto B"></div><div><label class="lbl" for="np-place">Lugar o ecosistema</label><input id="np-place" placeholder="Ej: Bosque de galería"></div><button class="btn gold full" style="height:56px" data-act="saveproject">Crear proyecto</button>');
   var inp=mo.querySelector('#np-name');if(inp)inp.focus();break
  }
  case 'saveproject':{
   var nm=($('#np-name').value||'').trim(),pl=($('#np-place').value||'').trim();
   if(!nm){toast('Ponle un nombre al proyecto');break}
   S.projects.push({id:uid(),name:nm,place:pl||'Sin especificar'});save();var mm=$('.modal');if(mm)mm.remove();render();toast('Proyecto creado');break
  }
  case 'delproject':{
   var pr=proj(ds.id),n=S.obs.filter(function(o){return o.pid===ds.id}).length;
   if(pr&&confirm('¿Eliminar «'+pr.name+'» y sus '+n+' registros? No se puede deshacer.')){S.projects=S.projects.filter(function(p){return p.id!==ds.id});S.obs=S.obs.filter(function(o){return o.pid!==ds.id});save();stack=[];view={name:'home'};render()}
   break
  }
  case 'chip':draft[ds.k]=draft[ds.k]===ds.v?'':ds.v;render();break;
  case 'qty':{draft.qty=Math.max(1,draft.qty+Number(ds.d));var q=$('#qty');if(q)q.textContent=draft.qty;break}
  case 'photo':$('#file').click();break;
  case 'rmphoto':draft.photos.splice(Number(ds.i),1);render();break;
  case 'gps':requestGps();break;
  case 'dictate':dictate();break;
  case 'save':saveObs();break;
  case 'edit':{
   var o=S.obs.find(function(x){return x.id===ds.id});if(!o)break;
   draft={pid:o.pid,sci:o.sci,common:o.common,qty:o.qty,habitat:o.habitat,weather:o.weather,temp:o.temp==null?'':String(o.temp),notes:o.notes,photos:o.photos.slice(),lat:o.lat,lon:o.lon,alt:o.alt,acc:o.acc||0,gpsState:o.lat!=null?'ok':'err',ts:o.ts,editId:o.id};
   go({name:'new'});break
  }
  case 'delobs':if(confirm('¿Eliminar esta observación?')){S.obs=S.obs.filter(function(x){return x.id!==ds.id});save();back();toast('Observación eliminada')}break;
  case 'fmt':expFmt=ds.v;render();break;
  case 'export':exportProject(ds.id);break;
  case 'seemap':{var ob=S.obs.find(function(x){return x.id===ds.id});go({name:'map',pid:ob?ob.pid:'all',sel:ds.id});break}
  case 'mapfilter':view={name:'map',pid:ds.id==='all'?null:ds.id,sel:null};render();break;
  case 'pin':view.sel=ds.id;render();break;
  case 'toggle':S.settings[ds.k]=!S.settings[ds.k];save();render();break;
  case 'backup':dl('cuaderno-campo-copia-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify(S));toast('Copia descargada');break;
  case 'restore':$('#restore').click();break;
  case 'exportall':if(!S.obs.length){toast('No hay registros para exportar')}else{dl('cuaderno-campo-todo.csv','text/csv;charset=utf-8',csv(S.obs.slice().sort(function(a,b){return a.ts-b.ts})));toast('Archivo CSV descargado')}break;
  case 'demo':if(confirm('Se reemplazarán tus datos actuales por los de ejemplo. ¿Continuar?')){S=seed();S.settings.welcomed=true;save();render();toast('Datos de ejemplo restaurados')}break;
  case 'wipe':if(confirm('Se borrarán todos los proyectos y registros de este dispositivo. ¿Continuar?')){S={projects:[],obs:[],settings:S.settings};save();render();toast('Datos borrados')}break;
 }
}

app.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el&&app.contains(el))act(el.dataset.act,el)});
app.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-act]')){e.preventDefault();act(e.target.dataset.act,e.target)}});
app.addEventListener('input',function(e){var t=e.target;if(draft&&t.dataset&&t.dataset.f){draft[t.dataset.f]=t.value}});
app.addEventListener('change',function(e){
 var t=e.target;if(!t.dataset)return;
 if(t.dataset.f==='sci'&&draft){
  var v=t.value.trim().toLowerCase(),hit=CAT.find(function(c){return c[0].toLowerCase()===v||c[1].toLowerCase()===v});
  if(hit){draft.sci=hit[0];t.value=hit[0];if(!draft.common){draft.common=hit[1];var cm=$('#f-common');if(cm)cm.value=hit[1]}}
 }
 if(t.dataset.f==='pid'&&draft)draft.pid=t.value;
 if(t.dataset.s==='coord'){S.settings.coord=t.value;save()}
});
$('#file').addEventListener('change',function(e){
 var files=Array.prototype.slice.call(e.target.files||[]);e.target.value='';
 if(!draft||!files.length)return;
 toast('Procesando foto…');
 Promise.all(files.map(readImg)).then(function(r){r.forEach(function(s){if(s)draft.photos.push(s)});if(view.name==='new')render()})
});
$('#restore').addEventListener('change',function(e){
 var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
 var r=new FileReader();
 r.onload=function(){try{var d=JSON.parse(r.result);if(!d.projects||!d.obs)throw 0;if(!d.settings)d.settings=S.settings;S=d;save();render();toast('Copia restaurada')}catch(x){toast('El archivo no es una copia válida')}};
 r.readAsText(f)
});
window.addEventListener('online',function(){if(view.name==='home')render()});
window.addEventListener('offline',function(){if(view.name==='home')render()});

applySettings();
view={name:S.settings.welcomed?'home':'welcome'};
render();
var sp=$('#splash');
if(sp){setTimeout(function(){sp.classList.add('out');setTimeout(function(){sp.remove()},400)},1300)}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
